<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de la Prueba</title>
    <link rel="icon" type="image/png" href="/examen_contadores/public/images/orb-logo.png">
    <link rel="shortcut icon" type="image/png" href="/examen_contadores/public/images/orb-logo.png">
    <link rel="stylesheet" href="/examen_contadores/public/css/theme.css">
    <link rel="stylesheet" href="/examen_contadores/public/css/detalle-modern.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <img src="/examen_contadores/public/images/orb-logo.png" alt="Logo" class="brand-logo">
                <div class="brand-text">
                    <h1>Detalle de la Prueba</h1>
                    <p>Revisión de Respuestas</p>
                </div>
            </div>
            <div class="header-actions">
                <button onclick="window.history.back()" class="back-button">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 9H3M3 9L9 15M3 9L9 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Volver
                </button>
            </div>
        </header>
        
        <main class="app-main">
            <div class="main-content-wrapper">
                <!-- Panel de navegación lateral -->
                <aside class="navigation-panel">
                    <div class="nav-header">
                        <h3>Navegación</h3>
                        <span id="navProgress">0/50</span>
                    </div>
                    <div id="navigationGrid" class="navigation-grid">
                        <!-- Se llenará dinámicamente -->
                    </div>
                </aside>
                
                <!-- Contenido principal -->
                <div class="main-content">
                    <!-- Información del estudiante -->
                    <div class="student-card">
                        <div class="student-info-grid">
                            <div class="info-item">
                                <span class="info-label">Estudiante</span>
                                <span id="studentName" class="info-value">-</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Cédula</span>
                                <span id="studentCedula" class="info-value">-</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Fecha</span>
                                <span id="examDate" class="info-value">-</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Porcentaje</span>
                                <span id="percentage" class="info-value score">-</span>
                            </div>
                        </div>
                        
                        <!-- Estadísticas detalladas -->
                        <div class="stats-row">
                            <div class="stat-item correct">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 12L11 14L15 10M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <div class="stat-content">
                                    <span class="stat-number" id="correctAnswers">0</span>
                                    <span class="stat-text">Correctas</span>
                                </div>
                            </div>
                            
                            <div class="stat-item incorrect">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M10 14L12 12M12 12L14 10M12 12L10 10M12 12L14 14M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <div class="stat-content">
                                    <span class="stat-number" id="incorrectAnswers">0</span>
                                    <span class="stat-text">Incorrectas</span>
                                </div>
                            </div>
                            
                            <div class="stat-item unanswered">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M8.228 9C8.614 7.224 10.162 6 12 6C14.209 6 16 7.791 16 10C16 11.691 14.964 13.13 13.5 13.658V14M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12ZM12 17H12.01V17.01H12V17Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <div class="stat-content">
                                    <span class="stat-number" id="unansweredQuestions">0</span>
                                    <span class="stat-text">No Respondidas</span>
                                </div>
                            </div>
                            
                            <div class="stat-item total">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 5H7C5.89543 5 5 5.89543 5 7V19C5 20.1046 5.89543 21 7 21H17C18.1046 21 19 20.1046 19 19V7C19 5.89543 18.1046 5 17 5H15M9 5C9 6.10457 9.89543 7 11 7H13C14.1046 7 15 6.10457 15 5M9 5C9 3.89543 9.89543 3 11 3H13C14.1046 3 15 3.89543 15 5M12 12H15M12 16H15M9 12H9.01M9 16H9.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <div class="stat-content">
                                    <span class="stat-number" id="totalQuestions">0</span>
                                    <span class="stat-text">Total Preguntas</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Preguntas y respuestas -->
                    <div id="questionsContainer" class="questions-container">
                        <div class="loading-state">
                            <div class="spinner"></div>
                            <p>Cargando detalles de la prueba...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <footer class="app-footer">
            <p>© 2026 G.F. SISTEMAS</p>
        </footer>
    </div>
    
    <script src="/examen_contadores/public/js/detalle-modern.js"></script>
</body>
</html>

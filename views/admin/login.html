<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Login</title>
    <link rel="icon" type="image/png" href="/examen_contadores/public/images/orb-logo.png">
    <link rel="shortcut icon" type="image/png" href="/examen_contadores/public/images/orb-logo.png">
    <link rel="stylesheet" href="/examen_contadores/public/css/theme.css">
    <link rel="stylesheet" href="/examen_contadores/public/css/login-modern.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="login-logo">
                <img src="/examen_contadores/public/images/orb-logo.png" alt="Logo">
            </div>
            
            <!-- Título -->
            <h1 class="login-title">Panel Administrativo</h1>
            <p class="login-subtitle">Acceso para Administradores</p>
            
            <!-- Formulario -->
            <form id="adminLoginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required 
                        placeholder="Ingresa tu usuario"
                        class="login-input"
                        autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="Ingresa tu contraseña"
                        class="login-input"
                        autocomplete="off">
                </div>
                
                <button type="submit" class="login-button">
                    <span>Ingresar</span>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4.16667 10H15.8333M15.8333 10L10 4.16667M15.8333 10L10 15.8333" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>
    
    <script src="/examen_contadores/public/js/admin-login.js"></script>
</body>
</html>
